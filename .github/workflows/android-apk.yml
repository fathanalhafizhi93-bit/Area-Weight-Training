name: Build IronPulse APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"

jobs:
  build-apk:
    name: Test & Build Debug/Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK 36 & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=""
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/tools/bin" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/tools/bin" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Prepare signing keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          rm -f local.properties
          if [ ! -s debug.keystore ] && [ -n "${SECRET_KEYSTORE_B64}" ]; then
            printf '%s' "${SECRET_KEYSTORE_B64}" | tr -d '\r\n ' | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating ephemeral debug.keystore via keytool"
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -storetype PKCS12 > /dev/null

      - name: Prepare Firebase & Google Services configuration
        env:
          SECRET_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SECRET_FIRESTORE_DB_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
        run: |
          mkdir -p app app/src/main/res/values
          USED_CI_FALLBACK=false
          if [ ! -s app/google-services.json ] && [ -n "${SECRET_GOOGLE_SERVICES}" ]; then
            if printf '%s' "${SECRET_GOOGLE_SERVICES}" | grep -q '"project_info"'; then
              printf '%s\n' "${SECRET_GOOGLE_SERVICES}" > app/google-services.json
            else
              printf '%s' "${SECRET_GOOGLE_SERVICES}" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            USED_CI_FALLBACK=true
            echo "::warning::app/google-services.json missing in checkout/secrets; creating CI fallback config for compilation & tests."
            python3 - << 'PYEOF'
          import json
          cfg = {
              "project_info": {
                  "project_number": "100000000000",
                  "project_id": "ironpulse-ci-fallback",
                  "storage_bucket": "ironpulse-ci-fallback.firebasestorage.app",
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                          "android_client_info": {"package_name": "com.aistudio.ironpulse.k7m2xp"},
                      },
                      "oauth_client": [
                          {
                              "client_id": "100000000000-ci0fallback0web0client000000000.apps.googleusercontent.com",
                              "client_type": 3,
                          }
                      ],
                      "api_key": [{"current_key": "AIzaSyCiFallbackPlaceholderKey000000000"}],
                      "services": {
                          "appinvite_service": {
                              "other_platform_oauth_client": [
                                  {
                                      "client_id": "100000000000-ci0fallback0web0client000000000.apps.googleusercontent.com",
                                      "client_type": 3,
                                  }
                              ]
                          }
                      },
                  }
              ],
              "configuration_version": "1",
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          PYEOF
          fi
          test -s app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null

          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            echo "::warning::firebase_applet_config.xml missing; creating CI fallback resource."
            python3 - << 'PYEOF'
          import os
          from xml.sax.saxutils import escape
          db_id = escape(os.environ.get("SECRET_FIRESTORE_DB_ID") or "(default)")
          xml_content = (
              '<?xml version="1.0" encoding="utf-8" standalone="no"?>\n'
              "<resources>\n"
              f'    <string name="firestore_database_id" translatable="false">{db_id}</string>\n'
              "</resources>\n"
          )
          with open("app/src/main/res/values/firebase_applet_config.xml", "w", encoding="utf-8") as f:
              f.write(xml_content)
          PYEOF
          fi
          test -s app/src/main/res/values/firebase_applet_config.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/res/values/firebase_applet_config.xml')"

          KEYSTORE_SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey -storetype PKCS12 2>/dev/null | awk '/SHA1:/ {gsub(":", "", $2); print tolower($2); exit}')
          echo "Signing keystore SHA1: ${KEYSTORE_SHA1:-unknown}"
          if [ "$USED_CI_FALLBACK" = "true" ]; then
            echo "### Firebase CI Fallback Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository tidak menyertakan \`app/google-services.json\` dan secret \`GOOGLE_SERVICES_JSON\` belum diisi. Build tetap berjalan memakai konfigurasi fallback agar tes & kompilasi lulus, namun Google Sign-In pada APK hasil CI ini membutuhkan \`GOOGLE_SERVICES_JSON\` (dan \`FIRESTORE_DATABASE_ID\` / \`DEBUG_KEYSTORE_BASE64\` bila file tidak di-commit)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$KEYSTORE_SHA1" ] && ! grep -qi "$KEYSTORE_SHA1" app/google-services.json; then
            echo "::warning::Signing keystore SHA1 ($KEYSTORE_SHA1) does not match any certificate_hash in app/google-services.json! Google Sign-In will fail on device unless matching keystore/SHA1 is configured."
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Build Debug and Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Stage APK artifacts
        run: |
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          VERSION_NAME=${VERSION_NAME:-0.0.1-alpha}
          mkdir -p dist-apks
          cp app/build/outputs/apk/release/app-release.apk "dist-apks/IronPulse-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist-apks/IronPulse-${VERSION_NAME}-debug.apk"
          ls -lh dist-apks

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironpulse-release-apk
          path: dist-apks/*-release.apk
          retention-days: 30

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironpulse-debug-apk
          path: dist-apks/*-debug.apk
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
