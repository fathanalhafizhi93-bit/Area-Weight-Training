name: Build IronPulse APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test & Build Debug/Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK 36 & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          test -f debug.keystore

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build Debug and Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --console=plain

      - name: Stage APK artifacts
        run: |
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          VERSION_NAME=${VERSION_NAME:-1.0.0-beta}
          mkdir -p dist-apks
          cp app/build/outputs/apk/release/app-release.apk "dist-apks/IronPulse-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist-apks/IronPulse-${VERSION_NAME}-debug.apk"
          ls -lh dist-apks

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironpulse-release-apk
          path: dist-apks/*-release.apk
          retention-days: 30

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironpulse-debug-apk
          path: dist-apks/*-debug.apk
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
